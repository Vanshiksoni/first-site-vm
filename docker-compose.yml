services:
  nginx-portal:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nginx-portal
    ports:
      - "80:80"
    volumes:
      - ./:/usr/share/nginx/html:ro
    networks:
      - rag-network
    restart: unless-stopped

  application-service:
    build:
      context: ./application-service
      dockerfile: Dockerfile
    container_name: application-service
    ports:
      - "8002:8002"
    environment:
      - RETRIEVAL_URL=http://retrieval-service:8001/search
      - LLM_URL=http://llm-service:8000/generate
    volumes:
      - ./application-service:/app
    networks:
      - rag-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - retrieval-service
      - llm-service
    restart: unless-stopped

  retrieval-service:
    build:
      context: ./retrieval-service
      dockerfile: Dockerfile
    container_name: retrieval-service
    ports:
      - "8001:8001"
    volumes:
      - ./retrieval-service:/app
    networks:
      - rag-network
    restart: unless-stopped

  llm-service:
    build:
      context: ./llm-service
      dockerfile: Dockerfile
    container_name: llm-service
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434/api/generate
      - MODEL=llama3.2:3b
    volumes:
      - ./llm-service:/app
    networks:
      - rag-network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

networks:
  rag-network:
    driver: bridge
