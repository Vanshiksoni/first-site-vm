<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Knowledge Retrieval Service</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --bg-card: rgba(18, 24, 38, 0.7);
            --border-color: rgba(255, 255, 255, 0.08);
            --border-highlight: rgba(99, 102, 241, 0.4);
            --primary-glow: #6366f1;
            --cyan-glow: #06b6d4;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --text-dim: #6b7280;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 80% 20%, rgba(6, 182, 212, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(99, 102, 241, 0.12) 0%, transparent 40%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 30px 20px 60px;
        }

        .wrapper {
            width: 100%;
            max-width: 960px;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 20px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            margin-bottom: 30px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: white;
        }

        .brand img {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--border-highlight);
        }

        .brand-title {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 1.1rem;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .nav-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .nav-pill:hover, .nav-pill.active {
            color: white;
            background: rgba(6, 182, 212, 0.2);
            border-color: var(--cyan-glow);
        }

        .hero {
            text-align: center;
            margin-bottom: 35px;
        }

        .hero h1 {
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 2.3rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 30%, #67e8f9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .hero p {
            font-size: 1rem;
            color: var(--text-muted);
        }

        .card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            margin-bottom: 25px;
        }

        .search-box {
            display: flex;
            gap: 12px;
        }

        input {
            flex: 1;
            background: rgba(9, 13, 22, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px 18px;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: all 0.2s ease;
        }

        input:focus {
            border-color: var(--cyan-glow);
            box-shadow: 0 0 0 3px rgba(6, 182, 212, 0.2);
        }

        .btn-search {
            background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%);
            color: white;
            border: none;
            padding: 14px 28px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-search:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(6, 182, 212, 0.4);
        }

        #status {
            margin-top: 16px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .result-card {
            background: rgba(13, 18, 30, 0.7);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 14px;
            transition: all 0.2s ease;
        }

        .result-card:hover {
            border-color: rgba(6, 182, 212, 0.4);
            background: rgba(18, 24, 38, 0.9);
        }

        .score-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .score-badge {
            background: rgba(6, 182, 212, 0.15);
            color: #67e8f9;
            border: 1px solid rgba(6, 182, 212, 0.3);
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .chunk-content {
            font-size: 0.95rem;
            color: #e2e8f0;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        footer {
            margin-top: auto;
            padding-top: 40px;
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-dim);
        }
    </style>
</head>
<body>

<div class="wrapper">

    <header class="top-nav">
        <a href="/ui" class="brand">
            <img src="/ui/avatar.jpg" alt="Logo">
            <span class="brand-title">Semantic Retrieval DB</span>
        </a>
        <nav class="nav-links">
            <a href="http://localhost:8002/ui" class="nav-pill" target="_blank">🎓 Helpdesk</a>
            <a href="/ui" class="nav-pill active">📚 Retrieval DB</a>
            <a href="http://localhost:8000/ui" class="nav-pill" target="_blank">⚡ LLM Service</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Vector Search & Retrieval Service</h1>
        <p>Perform direct cosine similarity searches on the university academic knowledge base.</p>
    </section>

    <main class="card">
        <div class="search-box">
            <input type="text" id="query" placeholder="Enter search query (e.g. grading policies, assignment deadlines)...">
            <button class="btn-search" onclick="searchKnowledge()">
                🔍 Search Vector Store
            </button>
        </div>
        <div id="status"></div>
    </main>

    <div id="results"></div>

    <footer>
        Sentence-Transformers (all-MiniLM-L6-v2) &bull; Cosine Similarity Search Engine
    </footer>

</div>

<script>
    async function searchKnowledge() {
        const query = document.getElementById("query").value.trim();
        const status = document.getElementById("status");
        const results = document.getElementById("results");

        if (!query) {
            status.textContent = "Please enter a search query.";
            return;
        }

        status.textContent = "Searching vector embeddings...";
        results.innerHTML = "";

        try {
            let response = await fetch("/search?query=" + encodeURIComponent(query));
            if (!response.ok) {
                response = await fetch("/search?q=" + encodeURIComponent(query));
            }
            const data = await response.json();

            if (data.error) {
                status.textContent = data.error;
                return;
            }

            const retrieved = data.relevant_context || [];
            status.textContent = `Found ${retrieved.length} relevant vector chunks for: "${query}"`;

            retrieved.forEach((item, index) => {
                const card = document.createElement("div");
                card.className = "result-card";

                let score = typeof item.score === "number" ? item.score : 0;
                const scorePct = score <= 1 ? Math.round(score * 100) : Math.round(score);

                card.innerHTML = `
                    <div class="score-row">
                        <span style="font-weight: 600; color: white;">Result #${index + 1}</span>
                        <span class="score-badge">Similarity Score: ${score.toFixed(4)} (${scorePct}%)</span>
                    </div>
                    <div class="chunk-content">${escapeHtml(item.chunk || "")}</div>
                `;

                results.appendChild(card);
            });

        } catch (error) {
            status.textContent = "Error connecting to Retrieval Service.";
            console.error(error);
        }
    }

    function escapeHtml(str) {
        return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    document.getElementById("query").addEventListener("keydown", function(e) {
        if (e.key === "Enter") searchKnowledge();
    });
</script>

</body>
</html>
