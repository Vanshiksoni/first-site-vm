<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Service - Code Llama</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
        }

        textarea {
            width: 100%;
            height: 150px;
            padding: 10px;
            font-size: 16px;
            box-sizing: border-box;
        }

        button {
            margin-top: 15px;
            padding: 12px 25px;
            font-size: 16px;
            cursor: pointer;
        }

        #response {
            margin-top: 25px;
            padding: 20px;
            border: 1px solid #ccc;
            min-height: 100px;
            white-space: pre-wrap;
        }
    </style>
</head>

<body>

    <h1>Code Llama LLM Service</h1>

    <p>Enter a prompt:</p>

    <textarea id="prompt"
        placeholder="Example: Explain Docker in simple terms..."></textarea>

    <br>

    <button onclick="generateResponse()">Generate Response</button>

    <div id="response">Response will appear here...</div>

    <script>
        async function generateResponse() {
            const prompt = document.getElementById("prompt").value;
            const responseBox = document.getElementById("response");

            if (!prompt.trim()) {
                responseBox.textContent = "Please enter a prompt.";
                return;
            }

            responseBox.textContent = "Generating response...";

            try {
                const response = await fetch("/generate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        prompt: prompt
                    })
                });

                const data = await response.json();

                responseBox.textContent = data.response;
            } catch (error) {
                responseBox.textContent =
                    "Error connecting to LLM service: " + error;
            }
        }
    </script>

</body>
</html>
